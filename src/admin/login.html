<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Fourth Way Books</title>
    <link rel="stylesheet" href="../scss/main.scss">
</head>

<body class="admin-login">
    <div class="login-card">
        <div style="text-align: right; margin-bottom: 1rem;">
            <button id="theme-toggle" class="header-control-btn">🌙</button>
            <button id="lang-toggle" class="header-control-btn">FA</button>
        </div>
        <h2 data-i18n="admin.titles.login">Admin Portal</h2>
        <div id="error-msg" class="error-msg"></div>
        <form id="login-form">
            <div class="form-group">
                <label for="username" data-i18n="admin.login.username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password" data-i18n="admin.login.password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn-login" data-i18n="admin.login.loginBtn">Login</button>
        </form>
    </div>

    <script type="module" src="../js/admin.js"></script>
</body>

</html>
